<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HeatLab Analytics: urban 2 m air-temperature downscaling</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F5;--panel:#fff;--bd:#D8DEE8;--bd2:#E7EBF2;--tx:#18202F;--mu:#5C687C;--mu2:#8792A5;
  --nav:#0F1A2B;--nav2:#1A2740;--acc:#E4572E;--ok:#14876F;--warn:#B7791F;--bad:#C0392B;
  --f:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:400 12.5px/1.45 var(--f);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overflow:hidden}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
#app{display:grid;grid-template-columns:184px minmax(0,1fr);grid-template-rows:44px 46px minmax(0,1fr);height:100vh}
/* top bar */
#top{grid-column:1/3;background:var(--nav);color:#fff;display:flex;align-items:center;gap:14px;padding:0 14px;border-bottom:1px solid #000}
#top b{font-weight:700;font-size:14px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
#top b i{width:14px;height:14px;border-radius:50%;background:conic-gradient(from 200deg,#4A5BFF,#B13CA6,#F4572E,#FFC24B,#4A5BFF)}
#top .sep{width:1px;height:18px;background:#3A4864}
#top .sub{color:#A9B4CA;font-size:12px}
#top .sp{flex:1}
.chip{font-size:11.5px;padding:2px 9px;border-radius:99px;border:1px solid #3A4864;color:#C8D0E0;white-space:nowrap}
.chip.w{border-color:#8A6A24;color:#F0C766}
/* nav */
#nav{grid-row:2/4;background:var(--nav);padding:8px 8px;display:flex;flex-direction:column;gap:2px;overflow:auto}
#nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:5px;color:#B6C0D4;font-size:12.5px;font-weight:500}
#nav button:hover{background:var(--nav2);color:#fff}
#nav button[aria-current=true]{background:var(--nav2);color:#fff;box-shadow:inset 3px 0 0 var(--acc)}
#nav button:focus-visible{outline:2px solid var(--acc)}
#nav svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#nav .grp{font-size:10.5px;color:#6F7C97;padding:12px 10px 4px;font-weight:600}
#nav .foot{margin-top:auto;font-size:11px;color:#7F8CA7;padding:10px;line-height:1.5;border-top:1px solid #243250}
/* filters */
#filters{background:#fff;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:16px;padding:0 14px;overflow-x:auto;white-space:nowrap}
.fg{display:flex;align-items:center;gap:6px}
.fg>span{font-size:11.5px;color:var(--mu);font-weight:500}
.seg{display:flex;border:1px solid var(--bd);border-radius:5px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:4px 10px;font-size:12px;font-weight:500;border-left:1px solid var(--bd);color:var(--tx);background:#fff}
.seg button:first-child{border-left:0}
.seg button:hover{background:#F2F4F8}
.seg button[aria-pressed=true]{background:var(--nav);color:#fff}
.seg button:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.cb{display:inline-flex;align-items:center;gap:6px;padding:3px 9px 3px 7px;border:1px solid var(--bd);border-radius:5px;cursor:pointer;background:#fff;font-size:12px;font-weight:500}
.cb i{width:9px;height:9px;border-radius:2px;background:var(--c)}
.cb[aria-pressed=false]{opacity:.45;background:#F5F7FA}
.cb small{color:var(--mu);font-weight:400}
select{border:1px solid var(--bd);border-radius:5px;padding:3px 6px;background:#fff;font-size:12px}
.ghost{all:unset;cursor:pointer;padding:4px 9px;border:1px solid var(--bd);border-radius:5px;font-size:12px;font-weight:500}
.ghost:hover{background:#F2F4F8}
#fsum{margin-left:auto;color:var(--mu);font-size:12px;white-space:nowrap}
#fsum b{color:var(--tx);font-weight:600}
/* main */
#main{overflow:auto;padding:10px 12px 18px;min-width:0}
.view{display:none}.view.on{display:block}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:10px}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.h200{height:200px}.h340{height:340px}.h520{height:520px}.h240{height:240px}.h280{height:280px}.h320{height:320px}.h380{height:380px}.h440{height:440px}.hauto{height:auto}
.p{background:var(--panel);border:1px solid var(--bd);border-radius:6px;display:flex;flex-direction:column;min-height:0;min-width:0}
.ph{display:flex;align-items:center;gap:10px;padding:7px 10px;border-bottom:1px solid var(--bd2);min-height:34px}
.ph h3{margin:0;font-size:12.5px;font-weight:600;letter-spacing:-.005em;white-space:nowrap}
.ph .st{color:var(--mu);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.ph .ctl{margin-left:auto;display:flex;gap:8px;align-items:center}
.pb{flex:1;min-height:0;position:relative;overflow:hidden}
.pb.sc{overflow:auto}
.pb svg,.pb canvas{display:block;width:100%;height:100%}
.note{font-size:11.5px;color:var(--mu);padding:5px 10px;border-top:1px solid var(--bd2);line-height:1.4}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--mu);padding:5px 10px;border-top:1px solid var(--bd2)}
.leg span{display:inline-flex;align-items:center;gap:5px}
.leg i{display:inline-block;width:16px;height:3px;border-radius:2px;background:var(--c)}
.leg i.d{background:repeating-linear-gradient(90deg,var(--c) 0 4px,transparent 4px 7px)}
.leg i.dot{width:8px;height:8px;border-radius:50%}
/* kpi */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:10px}
.k{background:var(--panel);border:1px solid var(--bd);border-radius:6px;padding:9px 11px 8px;min-width:0}
.k .l{font-size:11.5px;color:var(--mu);font-weight:500;display:flex;justify-content:space-between;gap:6px}
.k .v{font-size:25px;font-weight:650;letter-spacing:-.02em;line-height:1.15;margin-top:2px}
.k .v small{font-size:12px;font-weight:500;color:var(--mu);margin-left:3px;letter-spacing:0}
.k .r{font-size:11.5px;color:var(--mu);margin-top:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.d{font-weight:600;padding:0 6px;border-radius:3px;font-size:11.5px}
.d.g{background:#DDF1EA;color:#0C6A56}.d.b{background:#F7DCD7;color:#9B2B1D}.d.n{background:#E7EBF2;color:#46526A}.d.w{background:#F8E8C9;color:#7A4E0A}
.bar{height:6px;border-radius:3px;background:#E7EBF2;margin-top:6px;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
/* findings */
.fl{list-style:none;margin:0;padding:4px 10px 6px;overflow:auto;height:100%}
.fl li{display:grid;grid-template-columns:16px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd2);font-size:12.5px;line-height:1.4}
.fl li:last-child{border:0}
.fl .ic{width:8px;height:8px;border-radius:50%;margin-top:5px}
.fl .i-ok{background:var(--ok)}.fl .i-w{background:var(--warn)}.fl .i-n{background:var(--mu2)}.fl .i-b{background:var(--bad)}
/* table */
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{padding:4px 7px;border-bottom:1px solid var(--bd2);text-align:right;white-space:nowrap}
th{position:sticky;top:0;background:#F6F8FB;font-weight:600;color:var(--mu);cursor:pointer;user-select:none;z-index:1;border-bottom:1px solid var(--bd)}
th:first-child,td:first-child,th.l,td.l{text-align:left}
tbody tr{cursor:pointer}tbody tr:hover{background:#F6F8FB}tbody tr.sel{background:#FDEBE5}
td.b{font-weight:600}
.pos{color:#0C6A56}.neg{color:#9B2B1D}
.gt{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;padding:10px}
.gt button{all:unset;cursor:pointer;text-align:center;padding:7px 0;border-radius:4px;font-weight:600;font-size:12px;color:#fff;border:2px solid transparent}
.gt .pass{background:var(--ok)}.gt .warn{background:#C98A1B}.gt .fail{background:var(--bad)}
.gt button[aria-pressed=true]{border-color:var(--tx)}
.gd{padding:2px 12px 12px;font-size:12.5px}.gd h4{margin:4px 0 6px;font-size:13px}.gd p{margin:0 0 5px;max-width:70ch;color:#2D3A52}
.tip{position:fixed;pointer-events:none;background:#101828;color:#fff;font-size:11.5px;line-height:1.45;padding:6px 9px;border-radius:5px;z-index:60;display:none;max-width:260px;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.tip b{font-weight:600}
.lim{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 24px;padding:8px 12px 10px}
.lim div{padding:6px 0;border-bottom:1px solid var(--bd2)}
.lim b{display:block;font-size:12.5px}.lim span{color:var(--mu);font-size:12px}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.s3,.s4,.s5,.s6,.s7,.s8{grid-column:span 12}.lim{grid-template-columns:1fr}}
@media(max-width:760px){#app{grid-template-columns:1fr;grid-template-rows:44px auto auto minmax(0,1fr)}#nav{grid-row:auto;flex-direction:row;overflow-x:auto;padding:4px}#nav .grp,#nav .foot{display:none}#nav button{white-space:nowrap}#filters{grid-column:1;flex-wrap:wrap;padding:6px 10px;gap:8px;white-space:normal}#top{grid-column:1}.kpis{grid-template-columns:repeat(2,1fr)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header id="top"><b><i></i>HeatLab</b><span class="sep"></span><span class="sub">Urban 2 m air-temperature downscaling · station-level validation</span><span class="sp"></span><span class="chip">FAIRUrbTemp · ERA5 · OpenStreetMap · WorldCover</span><span class="chip w">Validated in 4 European cities only</span></header>
  <nav id="nav" aria-label="Views"></nav>
  <div id="filters" role="region" aria-label="Global filters"></div>
  <main id="main"></main>
</div>
<div class="tip" id="tip"></div>
<script src="data.js"></script>
<script>
const D=window.HEATLAB,R=D.results,ST=D.stations,CITIES=D.cities,$=s=>document.querySelector(s),NS='http://www.w3.org/2000/svg';
const CN={Biel:'Biel',Ghent:'Ghent',NoviSad:'Novi Sad',Rennes:'Rennes'},CCOL=['#4C6FFF','#9B59D0','#D9A21B','#2E9E6E'];  // by CITIES order: Rennes, Biel, NoviSad, Ghent
const M=['e','h','l','i'],MN={e:'Raw ERA5',h:'ERA5 + hour offset',l:'HeatLab',i:'Neighbour sensors (IDW)'},MC={e:'#8A94A8',h:'#4F5D75',l:'#E4572E',i:'#14876F'};
const f1=x=>(+x).toFixed(1),f2=x=>(+x).toFixed(2),f3=x=>(+x).toFixed(3),sg=(x,d=2)=>{const r=Math.abs(x).toFixed(d);return(+r===0?'':x>0?'+':'−')+r},pc=x=>Math.round(x*100)+'%',hh=h=>String(h).padStart(2,'0'),K=n=>n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?Math.round(n/1e3)+'k':''+n;
const el=(n,a={},p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const tip=$('#tip');const showTip=(e,h)=>{tip.innerHTML=h;tip.style.display='block';const w=tip.offsetWidth;tip.style.left=Math.min(e.clientX+14,innerWidth-w-8)+'px';tip.style.top=Math.min(e.clientY+14,innerHeight-tip.offsetHeight-8)+'px'},hideTip=()=>tip.style.display='none';

/* ---------------- state ---------------- */
const S={view:'overview',cities:new Set([0,1,2,3]),nf:'all',h0:0,h1:23,sel:null,mapMetric:'rl',show:{e:true,h:true,l:true,i:false},scMod:'l',sortKey:'rl',sortDir:1,weekStation:null};
const COLS=D.agg.cols,CI=Object.fromEntries(COLS.map((c,i)=>[c,i+3]));
const inH=h=>S.h0<=S.h1?(h>=S.h0&&h<=S.h1):(h>=S.h0||h<=S.h1);
const rowsF=()=>D.agg.rows.filter(r=>S.cities.has(r[0])&&inH(r[1])&&(S.nf==='all'||r[2]===S.nf));
function tot(rows){const t={n:0,cov:0,m:{}};M.forEach(k=>t.m[k]={se:0,ae:0,b:0,w:0});rows.forEach(r=>{t.n+=r[3];t.cov+=r[4];M.forEach(k=>{const m=t.m[k];m.se+=r[CI['se_'+k]];m.ae+=r[CI['ae_'+k]];m.b+=r[CI['b_'+k]];m.w+=r[CI['w_'+k]]})});return t}
const rmse=(t,k)=>t.n?Math.sqrt(t.m[k].se/t.n):NaN,mae=(t,k)=>t.n?t.m[k].ae/t.n:NaN,bias=(t,k)=>t.n?t.m[k].b/t.n:NaN,w1=(t,k)=>t.n?t.m[k].w/t.n:NaN;
const nfi=()=>S.nf==='all'?0:S.nf===0?1:2;           // index into per-station [all, day, night] arrays
const selStations=()=>ST.filter(s=>S.cities.has(CITIES.indexOf(s.city)));
const stKey=s=>s.city+'|'+s.id;

/* ---------------- layout scaffolding ---------------- */
const ICON={geo:'<path d="M12 3l9 5-9 5-9-5 9-5zM3 12.5l9 5 9-5M3 17l9 5 9-5"/>',overview:'<path d="M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z"/>',time:'<path d="M3 20V4M3 20h18M7 15l4-5 3 3 6-8"/>',stations:'<path d="M12 21s-6-5.3-6-10a6 6 0 1112 0c0 4.7-6 10-6 10z"/><circle cx="12" cy="11" r="2"/>',cities:'<path d="M4 20V9l5-3v14M9 20V4l6 3v13M15 20v-8l5-2v10M2 20h20"/>',drivers:'<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',valid:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>'};
const VIEWS=[['overview','Overview'],['time','Time & conditions'],['stations','Stations'],['cities','Cities & transfer'],['drivers','Drivers'],['geo','Geospatial & GPU'],['valid','Validity & scope']];
$('#nav').innerHTML='<div class="grp">ANALYSIS</div>'+VIEWS.map(([k,t])=>`<button data-v="${k}" aria-current="${k===S.view}"><svg viewBox="0 0 24 24">${ICON[k]}</svg>${t}</button>`).join('')+`<div class="foot">Out-of-fold predictions only: every number comes from stations the model never trained on.<br><br>Hours are UTC.</div>`;
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b)go(b.dataset.v)};
const P=(id,cls,title,st,ctl,body,extra='')=>`<section class="p ${cls}" id="p-${id}"><div class="ph"><h3>${title}</h3><span class="st">${st||''}</span><div class="ctl" id="c-${id}">${ctl||''}</div></div><div class="pb ${body||''}" id="b-${id}"></div>${extra}</section>`;
$('#main').innerHTML=`
<div class="view on" id="v-overview">
  <div class="kpis" id="kpis"></div>
  <div class="grid">
    ${P('map','s5 h520','Station map','Error by station, honours the day/night filter','<select id="mapMetric" aria-label="Map metric"></select>','','<div id="mapLegend" class="leg"></div><div class="note" id="mapSel">Click a station to select it.</div>')}
    <div class="s7" style="display:grid;grid-template-rows:1fr 1fr;gap:10px;height:520px;min-height:0">
      ${P('rmseh','','Error by hour of day','RMSE, °C, selected cities','','','<div class="leg" id="l-rmseh"></div>')}
      ${P('anomh','','Measured vs predicted anomaly by hour','Station minus ERA5, °C: how far the street departs from the grid cell','','','<div class="leg" id="l-anomh"></div>')}
    </div>
    ${P('scat','s4 h340','Predicted vs measured','Anomaly, °C · sample of held-out hours','<div class="seg" id="scMod"></div>','','<div class="note" id="n-scat"></div>')}
    ${P('hist','s4 h340','Error distribution','Prediction minus measurement, °C','','','<div class="leg" id="l-hist"></div>')}
    ${P('find','s4 h340','Findings for the current selection','Computed from the filtered results','','','')}
  </div>
</div>
<div class="view" id="v-time"><div class="grid">
  ${P('month','s8 h280','Error over time','Monthly RMSE, °C · months under 1,000 station-hours hidden','','','<div class="leg" id="l-month"></div>')}
  ${P('temp','s4 h280','Error by ERA5 air temperature','RMSE, °C: does skill hold in warm hours?','','','<div class="leg" id="l-temp"></div>')}
  ${P('week','s8 h320','Station week: thermometer vs model','Pick a station; out-of-fold predictions','<select id="wkSel" aria-label="Station"></select>','','<div class="leg" id="l-week"></div><div class="note" id="n-week"></div>')}
  ${P('covh','s4 h320','80% interval coverage by hour','Share of readings inside the model band','','','<div class="note" id="n-covh"></div>')}
</div></div>
<div class="view" id="v-stations"><div class="grid">
  ${P('tbl','s8 h440','Station table','Click a row to select. Metrics honour the day/night filter.','','sc','')}
  <div class="s4" style="display:grid;grid-template-rows:1fr 1fr;gap:10px;height:440px;min-height:0">
    ${P('st-sc','','Surroundings vs anomaly','Per station','<select id="stX" aria-label="X axis"></select>','','<div class="leg" id="l-stsc"></div>')}
    ${P('st-gain','','Gain by station','RMSE reduction vs ERA5, ranked','','','')}
  </div>
</div></div>
<div class="view" id="v-cities"><div class="grid">
  ${P('cmp','s7 h320','City comparison','RMSE, °C, current time filter','','','<div class="leg" id="l-cmp"></div>')}
  ${P('ctab','s5 h320','City summary','','','sc','')}
  ${P('loco','s6 h280','Held-out city (transfer)','Trained on three cities, tested on the fourth','','','<div class="leg" id="l-loco"></div>')}
  ${P('tmp','s6 h280','Later in time, same cities','Trained on the early record, tested on the later one','','','<div class="leg" id="l-tmp"></div>')}
  ${P('leak','s6 h200','Validation design changes the answer','Same model, three ways of scoring','','','<div class="note" id="n-leak"></div>')}
  ${P('ab','s6 h200','Model ablations (spatial blocks)','What each input group is worth, RMSE °C','','','<div class="note" id="n-ab"></div>')}
</div></div>
<div class="view" id="v-drivers"><div class="grid">
  ${P('shap','s5 h440','Feature importance','Mean |SHAP|, °C','','','<div class="leg"><span><i class="dot" style="--c:#17143D"></i>ERA5 weather and time</span><span><i class="dot" style="--c:#E4572E"></i>Surroundings and position</span></div>')}
  ${P('sens','s7 h440','Predicted anomaly as surroundings change','All panels share one vertical scale (°C)','','','<div class="leg"><span><i style="--c:#17143D"></i>Night</span><span><i style="--c:#E4572E"></i>Day</span><span style="margin-left:auto">Associations, not causal effects</span></div>')}
  ${P('rel','s12 hauto','Measured station anomaly vs surroundings','Spearman correlation across stations, per city. Bold: p&lt;0.05. Ghent (6 stations) excluded','','sc','<div class="note">Each cell uses 23 to 40 stations. A correlation tells you where the street runs warm or cool in the data; it does not show what a planting or paving change would do.</div>')}
</div></div>
<div class="view" id="v-valid"><div class="grid">
  ${P('gates','s7 h280','Validity checks','Run by the agent before results are reported','','','')}
  ${P('cal','s5 h280','Interval calibration by city','Share of readings inside the 80% band (target 80%)','','','<div class="note" id="n-cal"></div>')}
  ${P('lim','s12 hauto','Scope and limits','','','','')}
  ${P('prov','s12 hauto','Provenance and model','','','','')}
</div></div>
<div class="view" id="v-geo"><div class="grid">
  ${P('abl','s7 h280','Which surroundings data helps','RMSE reduction versus weather and time only, °C (5-fold spatial CV, LightGBM)','','','<div class="note" id="n-abl"></div>')}
  ${P('dlt','s5 hauto','Neural network on GPU vs LightGBM','Same folds, same rows; trained on a Colab T4','','','<div class="note" id="n-dlt"></div>')}
  ${P('ref','s6 hauto','Checking OSM features against satellite land cover','Correlation of water share within 250 m with ESA WorldCover, per city','','','<div class="note" id="n-ref"></div>')}
  ${P('lay','s6 hauto','Geospatial data layers','CRS handling and how each layer enters the model','','','')}
</div></div>`;
const GATEHTML='';

/* ---------------- filters ---------------- */
function buildFilters(){
  const f=$('#filters');
  f.innerHTML=`<div class="fg"><span>Cities</span>${CITIES.map((c,i)=>`<button class="cb" data-c="${i}" aria-pressed="${S.cities.has(i)}" style="--c:${CCOL[i]}"><i></i>${CN[c]} <small>${ST.filter(s=>s.city===c).length}</small></button>`).join('')}</div>
  <div class="fg"><span>Time of day</span><div class="seg" id="nfSeg">${[['all','All'],[0,'Day'],[1,'Night']].map(([v,t])=>`<button data-n="${v}" aria-pressed="${S.nf===v}">${t}</button>`).join('')}</div></div>

function drawShap(){
  const top=R.shap.slice(0,14),lab={e_dt3:'ERA5 temp. change, 3 h',e_dtd:'ERA5 change since yesterday',e_v:'ERA5 north-south wind',hod_cos:'Hour of day',dist_center_km:'Distance to city centre',wat_500:'Water within 500 m',e_ws:'ERA5 wind speed',doy_cos:'Season',doy_sin:'Season (phase)',e_rh:'ERA5 humidity',bld_500:'Buildings within 500 m',e_t2m:'ERA5 temperature',e_t24:'ERA5 24 h mean',e_cloud:'ERA5 cloud cover',elev_rel:'Height above city mean',e_u:'ERA5 east-west wind',e_sw:'ERA5 solar radiation',e_dew:'ERA5 dew point',wc_built_250:'Built-up land within 250 m (WorldCover)',wc_built_100:'Built-up land within 100 m (WorldCover)',wc_built_500:'Built-up land within 500 m (WorldCover)',wc_tree_250:'Tree cover within 250 m (WorldCover)',wc_water_500:'Water within 500 m (WorldCover)'};
  const {s,w,h}=svgIn('shap'),m={l:176,r:44,t:8,b:8},rh=(h-m.t-m.b)/top.length,mx=top[0].mean_abs_shap*1.05;
  top.forEach((t,i)=>{const y=m.t+rh*(i+.5),st=/^(bld|veg|wat|road|elev|dist|up_|down_|wc_|dsm_)/.test(t.feature),L=t.mean_abs_shap/mx*(w-m.l-m.r);el('text',{x:0,y:y+4,'font-size':11.5,fill:'#18202F'},s).textContent=lab[t.feature]||t.feature;const r=el('rect',{x:m.l,y:y-6,width:L,height:12,rx:2,fill:st?'#E4572E':'#17143D'},s);el('text',{x:m.l+L+5,y:y+4,'font-size':11,fill:'#5C687C'},s).textContent=f2(t.mean_abs_shap)})}
function drawSens(){
  const {b}=dims('sens');b.innerHTML='';const ks=Object.keys(R.sensitivity),SF={veg_250:'Vegetation within 250 m',bld_250:'Buildings within 250 m',wat_250:'Water within 250 m',road_250:'Road length within 250 m',elev_rel:'Height above city mean',up_veg:'Vegetation upwind'};
  b.style.cssText='display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:4px;padding:6px';
  const ys=ks.flatMap(k=>[...R.sensitivity[k].night.y,...R.sensitivity[k].day.y]),y0=Math.floor(Math.min(...ys)*4)/4,y1=Math.ceil(Math.max(...ys)*4)/4;
  ks.forEach(k=>{const c=document.createElement('div');c.style.cssText='position:relative;min-height:0';b.appendChild(c);const W=c.clientWidth||200,H=c.clientHeight||170,s=el('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H},c),d=R.sensitivity[k],xs=d.night.x,x0=xs[0],x1=xs[xs.length-1],a=frame(s,W,H,{l:30,r:6,t:18,b:22},x0,x1,y0,y1,{xf:v=>+v.toFixed(2)});
    el('text',{x:30,y:11,'font-size':11,'font-weight':600,fill:'#18202F'},s).textContent=SF[k]||k;
    [['night','#17143D'],['day','#E4572E']].forEach(([n,col])=>el('path',{d:path(d[n].x.map((x,i)=>[x,d[n].y[i]]),a.X,a.Y),fill:'none',stroke:col,'stroke-width':2.2},s))});
}
function drawRel(){
  const rel=R.observed_relations,names={veg_250:'Vegetation 250 m',bld_250:'Buildings 250 m',wat_250:'Water 250 m',road_250:'Road length 250 m',elev_rel:'Height above city mean'},ks=Object.keys(rel);
  const cols=[];CITIES.forEach(c=>{if(rel[ks[0]].night.some(x=>x.city===c))cols.push(c)});
  const cell=(x)=>{if(!x)return'<td>–</td>';const a=Math.min(1,Math.abs(x.rho)),bg=x.rho>0?`rgba(228,87,46,${a*.55})`:`rgba(47,95,208,${a*.55})`;return`<td style="background:${bg};${x.p<.05?'font-weight:700':'color:#5C687C'}">${sg(x.rho)}${x.p<.05?'':' ·'}</td>`};
  $('#b-rel').innerHTML=`<table><thead><tr><th class="l">Surrounding</th><th class="l">Time</th>${cols.map(c=>`<th>${CN[c]}</th>`).join('')}</tr></thead><tbody>${ks.map(k=>['night','day'].map(t=>`<tr style="cursor:default"><td class="l">${t==='night'?(names[k]||k):''}</td><td class="l">${t==='night'?'Night':'Day'}</td>${cols.map(c=>cell(rel[k][t].find(x=>x.city===c))).join('')}</tr>`).join('')).join('')}</tbody></table>`;
}
/* ---------------- validity ---------------- */
let gSel=(R.gates.find(g=>g.status!=='pass')||R.gates[0]).id;
function drawGates(){
  const b=$('#b-gates');b.innerHTML=`<div class="gt">${R.gates.map(g=>`<button class="${g.status}" data-id="${g.id}" aria-pressed="${g.id===gSel}" title="${g.title}">${g.id}</button>`).join('')}</div><div class="gd" id="gd"></div>`;
  b.querySelectorAll('button').forEach(x=>x.onclick=()=>{gSel=x.dataset.id;drawGates()});
  const g=R.gates.find(x=>x.id===gSel);$('#gd').innerHTML=`<h4>${g.id}: ${g.title} <span class="d ${g.status==='pass'?'g':'w'}" style="margin-left:6px">${g.status==='pass'?'Passed':g.status==='warn'?'Warning':'Failed'}</span></h4><p><b>Found.</b> ${g.evidence.replace(/^(\w+) have fewer/,'$1 has fewer')}.</p><p><b>Rule.</b> ${g.rule}</p>`;
  const np=R.gates.filter(x=>x.status==='pass').length;$('#p-gates .st').textContent=`${np} passed, ${R.gates.length-np} warnings, 0 failed`;
}
function drawCal(){
  const cv=R.spatial.coverage,rows=Object.keys(cv.by_city).map(c=>({c,v:cv.by_city[c]})),{s,w,h}=svgIn('cal'),m={l:60,r:40,t:12,b:24},rh=(h-m.t-m.b)/rows.length,X=v=>m.l+(v-.5)/.5*(w-m.l-m.r);
  [.6,.7,.8,.9,1].forEach(v=>{el('line',{x1:X(v),x2:X(v),y1:m.t,y2:h-m.b,stroke:'#E7EBF2'},s);el('text',{x:X(v),y:h-m.b+14,'text-anchor':'middle','font-size':10.5,fill:'#5C687C'},s).textContent=Math.round(v*100)+'%'});
  el('rect',{x:X(.73),y:m.t,width:X(.87)-X(.73),height:h-m.t-m.b,fill:'rgba(20,135,111,.10)'},s);el('line',{x1:X(.8),x2:X(.8),y1:m.t,y2:h-m.b,stroke:'#14876F','stroke-dasharray':'4 3','stroke-width':1.5},s);
  rows.forEach((r,i)=>{const y=m.t+rh*(i+.5);el('text',{x:0,y:y+4,'font-size':11.5,'font-weight':600,fill:'#18202F'},s).textContent=CN[r.c];el('rect',{x:X(.5),y:y-6,width:X(r.v)-X(.5),height:12,rx:2,fill:r.v<.73||r.v>.87?'#C98A1B':'#14876F'},s);el('text',{x:X(r.v)+5,y:y+4,'font-size':11.5,'font-weight':600,fill:'#18202F'},s).textContent=Math.round(r.v*100)+'%'});
  const out=rows.filter(r=>r.v<.73||r.v>.87).map(r=>CN[r.c]);$('#n-cal').innerHTML=`Shaded band is the accepted 73–87% range. ${out.length?`${out.join(' and ')} fall${out.length===1?'s':''} outside it, so the interval is narrower than its 80% label there.`:'All cities are inside it.'} Overall ${Math.round(cv.empirical*100)}%, mean width ${f2(cv.mean_width)} °C.`;
}
function drawStatic(){
  const nf=R.data_audit.filter(c=>!c.eligible_headline).map(c=>CN[c.city]).join(', ');
  $('#b-lim').innerHTML='<div class="lim">'+[['Four European networks only','Biel, Ghent, Novi Sad and Rennes. Hot-arid and tropical cities are untested; do not use HeatLab there.'],[nf+' is thin','Fewer than 20 stations: it trains the model and appears in transfer tests, not in headline spatial results.'],['Transfer is mixed','Held-out city: HeatLab beats raw ERA5 in all four (barely in Novi Sad), but beats the hour offset only in Biel, Ghent and Rennes.'],['Station metrics vs hour filter','Per-station figures (map, table) honour the day/night filter but not the hour range; city and hour charts honour all filters.'],['Surroundings are a snapshot','OpenStreetMap as of today; tagging completeness differs between cities and vegetation is the weakest layer.'],['Unequal records','Biel one summer, Rennes one year, Novi Sad about four years, Ghent seven. 10-minute and hourly sources are mixed.'],['Scatter and histogram are samples','4,000 random held-out hours per city. All KPIs and line charts use every held-out hour.'],['Association, not cause','Sensitivity curves and correlations describe four cities; they do not predict the effect of planting or paving.']].map(([a,b])=>`<div><b>${a}</b><span>${b}</span></div>`).join('')+'</div>';
  const c=D.card;$('#b-prov').innerHTML=`<div class="lim"><div><b>Data</b><span>FAIRUrbTemp station observations (QC-flagged values excluded). ERA5 hourly reanalysis and elevation via Open-Meteo. Surroundings come from OpenStreetMap recomputed with GeoPandas (local UTM, exact overlay) plus ESA WorldCover land cover and Copernicus elevation rasters; the feature comparison and the GPU neural network are on the Geospatial &amp; GPU page. No synthetic data.</span></div><div><b>Model</b><span>LightGBM, ${c.hyperparameters.n} trees, ${K(c.train_rows)} training rows. Target is station 2 m temperature minus ERA5 2 m temperature. Quantile models give the 80% interval.</span></div><div><b>Validation</b><span>Five spatial folds by station cluster, 0.5 km buffer, tuning on an inner split of training stations only. Random-row scoring reported only to show leakage.</span></div><div><b>Intended use</b><span>${c.intended_use.charAt(0).toUpperCase()+c.intended_use.slice(1)}</span></div></div>`;
}

/* ---------------- geospatial & GPU ---------------- */
function drawAbl(){
  const G=D.geo;if(!G){$('#b-abl').innerHTML='<div class="note">Run scripts 05–09 to add geospatial results.</div>';return}
  const base=G.abl[0].rmse,col=k=>k==='no_static'?'#18202F':k==='osm_gpd+raster'?MC.l:k.includes('gpd')?'#C13E18':k.includes('raster')?'#14876F':'#8A94A8';
  hbars('abl',G.abl.map(a=>({label:`${a.label} · ${f3(a.rmse)}`,v:Math.max(0,base-a.rmse),c:col(a.k),hl:a.k==='osm_gpd+raster'})),.1,{l:300,r:56,t:6,b:6,dec:3});
  const g=G.abl.find(a=>a.k==='osm_gpd'),j=G.abl.find(a=>a.k==='osm_js'),b=G.abl.find(a=>a.k==='osm_gpd+raster'),r=G.abl.find(a=>a.k==='raster');
  $('#n-abl').innerHTML=`Rebuilding the OSM features with GeoPandas lowers RMSE from ${f3(j.rmse)} to ${f3(g.rmse)} °C (better in ${g.folds_vs_grid.folds_improved} of 5 folds). Rasters alone reach ${f3(r.rmse)} without any OSM data. Both together: ${f3(b.rmse)} °C. Gains are small next to the effect of validation design.`;
}
function drawDlt(){
  const G=D.geo;if(!G)return;const d=G.dl.rows['osm_js+raster'],m=G.mlp.sets['osm_js+raster'],bb=G.dl.best_blend,cv=m.coverage80;
  const row=(n,x,cov,b)=>`<tr style="cursor:default"><td class="l"${b?' style="font-weight:700"':''}>${n}</td><td>${f3(x.rmse)}</td><td>${f3(x.mae)}</td><td>${cov==null?'–':pc(cov)}</td></tr>`;
  $('#b-dlt').innerHTML=`<table><thead><tr><th class="l">Model</th><th>RMSE °C</th><th>MAE °C</th><th>80% band covers</th></tr></thead><tbody>${row('LightGBM, OSM grid + rasters',d.lightgbm,null)}${row('Neural network (residual MLP), same inputs',d.mlp_gpu,cv)}${row('Average of the two',d.average,null,1)}<tr style="cursor:default"><td class="l">Average, with the GeoPandas LightGBM</td><td>${f3(bb['blend_w0.5'])}</td><td>–</td><td>–</td></tr></tbody></table>`;
  const wins=d.mlp_gpu.by_fold.filter((x,i)=>x<d.lightgbm.by_fold[i]).length,wa=d.average.by_fold.filter((x,i)=>x<d.lightgbm.by_fold[i]).length;
  $('#n-dlt').innerHTML=`${G.mlp.gpu_name}, ${G.mlp.epochs} epochs, fixed settings. The network alone ties LightGBM (better in ${wins} of 5 folds); the average beats LightGBM in ${wa} of 5. Its 80% band covers only ${pc(cv)}: too narrow, so LightGBM's quantile band stays the reported interval. Equal weights, no tuning on test folds.`;
}
function drawRef(){
  const G=D.geo;if(!G||!G.referee)return;const w=G.referee.water_250,cs=['Biel','Ghent','Rennes','NoviSad'],c=v=>v==null?'–':sg(v,2).replace('+','');
  $('#b-ref').innerHTML=`<table><thead><tr><th class="l">City</th><th>WorldCover water</th><th>Browser grid</th><th>GeoPandas</th></tr></thead><tbody>${cs.map(k=>`<tr style="cursor:default"><td class="l">${CN[k]}</td><td>${pc(w[k].mean_worldcover)}</td><td>${w[k].grid==null?'n/a':f2(w[k].grid)}</td><td style="font-weight:${w[k].grid!=null&&w[k].geopandas-w[k].grid>.3?700:400}">${w[k].geopandas==null?'n/a':f2(w[k].geopandas)}</td></tr>`).join('')}</tbody></table>`;
  $('#n-ref').innerHTML=`The first browser method missed Biel's lake: OSM stores large water bodies as several ways that must be joined into rings. GeoPandas joins them (polygonize), projects to local UTM metres and overlays exact areas. Novi Sad has no water within 250 m of any station, so no correlation exists there.`;
}
function drawLay(){
  const G=D.geo,z=G&&G.zarr;
  $('#b-lay').innerHTML=`<div class="lim">${[['OpenStreetMap vectors','Buildings, vegetation, water, roads. EPSG:4326 → UTM 32630 / 32631 / 32632 / 32634; exact overlay in 100, 250, 500 m circles and 8 wedges (GeoPandas, Shapely).'],['ESA WorldCover 2021','10 m land cover, EPSG:4326. Built, tree, low vegetation, crop and water shares per buffer (rasterio; buffers built in UTM, then transformed to the raster CRS).'],['Copernicus GLO-30 DSM','30 m surface model (includes buildings and trees). Station height, local relief and height relative to the 250 m and 500 m mean.'],['ERA5 as Zarr',z?`xarray Dataset (city × time) stored as Zarr, converted from the CSVs: ${z.dims.city} cities, ${K(z.dims.time)} hours, ${z.nvars} variables, ${z.t0} to ${z.t1}.`:'xarray Dataset stored as Zarr, converted from the CSVs.']].map(([a,b])=>`<div><b>${a}</b><span>${b}</span></div>`).join('')}</div>`;
}
/* ---------------- routing / refresh ---------------- */
const DRAW={
  overview:()=>{kpis();drawMap();drawRmseHour();drawAnomHour();drawScatter();drawHist();findings()},
  time:()=>{drawMonth();drawTemp();wkOptions();drawWeek();drawCovH()},
  stations:()=>{drawTable();drawStScat();drawGain()},
  cities:()=>{drawCmp();drawCityTab();drawLoco();drawTmp();drawLeak();drawAb()},
  drivers:()=>{drawShap();drawSens();drawRel()},
  geo:()=>{drawAbl();drawDlt();drawRef();drawLay()},
  valid:()=>{drawGates();drawCal();drawStatic()}
};
function go(v){S.view=v;document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id==='v-'+v));[...$('#nav').querySelectorAll('button')].forEach(b=>b.setAttribute('aria-current',b.dataset.v===v));$('#main').scrollTop=0;refresh()}
let pend=null;function refresh(){cancelAnimationFrame(pend);pend=requestAnimationFrame(()=>{summary();DRAW[S.view]()})}
new ResizeObserver(()=>refresh()).observe($('#main'));
buildFilters();refresh();
if(location.hash){const v=location.hash.slice(1);if(DRAW[v])go(v)}
</script>
